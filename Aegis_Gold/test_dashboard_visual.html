<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS API Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #f59e0b;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }
        .card h2 {
            color: #f59e0b;
            font-size: 18px;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #334155;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-label {
            color: #94a3b8;
            font-size: 14px;
        }
        .metric-value {
            font-weight: 600;
            font-size: 16px;
        }
        .confidence {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        .confidence.high { color: #10b981; }
        .confidence.medium { color: #f59e0b; }
        .confidence.low { color: #ef4444; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.active { background: #10b981; color: #fff; }
        .status.wait { background: #64748b; color: #fff; }
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .refresh-btn:hover {
            background: #2563eb;
        }
        .timestamp {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 10px;
        }
        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🎯 AEGIS GOLD - API Test Dashboard</h1>
    
    <div id="error" class="error" style="display: none;"></div>
    
    <div class="container">
        <div class="card">
            <h2>📊 XAUUSD (GOLD)</h2>
            <div class="confidence" id="xauusd-confidence">--</div>
            <div class="metric">
                <span class="metric-label">Action</span>
                <span class="metric-value" id="xauusd-action">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Direction</span>
                <span class="metric-value" id="xauusd-direction">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Grade</span>
                <span class="metric-value" id="xauusd-grade">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">ADX</span>
                <span class="metric-value" id="xauusd-adx">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">RSI</span>
                <span class="metric-value" id="xauusd-rsi">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Regime</span>
                <span class="metric-value" id="xauusd-regime">--</span>
            </div>
        </div>
        
        <div class="card">
            <h2>💶 EURUSD</h2>
            <div class="confidence" id="eurusd-confidence">--</div>
            <div class="metric">
                <span class="metric-label">Action</span>
                <span class="metric-value" id="eurusd-action">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Direction</span>
                <span class="metric-value" id="eurusd-direction">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Grade</span>
                <span class="metric-value" id="eurusd-grade">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">ADX</span>
                <span class="metric-value" id="eurusd-adx">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">RSI</span>
                <span class="metric-value" id="eurusd-rsi">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Regime</span>
                <span class="metric-value" id="eurusd-regime">--</span>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="fetchData()">🔄 Refresh Data</button>
    <div class="timestamp" id="timestamp">Last updated: Never</div>

    <script>
        const API_URL = 'http://127.0.0.1:5001';

        function getConfidenceClass(conf) {
            if (conf >= 60) return 'high';
            if (conf >= 40) return 'medium';
            return 'low';
        }

        async function fetchData() {
            try {
                const response = await fetch(`${API_URL}/aistate`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                // Update XAUUSD
                if (data.XAUUSD) {
                    const x = data.XAUUSD;
                    const confEl = document.getElementById('xauusd-confidence');
                    confEl.textContent = `${x.confidence}%`;
                    confEl.className = `confidence ${getConfidenceClass(x.confidence)}`;
                    
                    document.getElementById('xauusd-action').textContent = x.action || '--';
                    document.getElementById('xauusd-direction').textContent = x.direction || '--';
                    document.getElementById('xauusd-grade').textContent = x.grade || '--';
                    document.getElementById('xauusd-adx').textContent = x.adx ? x.adx.toFixed(1) : '--';
                    document.getElementById('xauusd-rsi').textContent = x.rsi ? x.rsi.toFixed(1) : '--';
                    document.getElementById('xauusd-regime').textContent = x.regime || '--';
                }
                
                // Update EURUSD
                if (data.EURUSD) {
                    const e = data.EURUSD;
                    const confEl = document.getElementById('eurusd-confidence');
                    confEl.textContent = `${e.confidence}%`;
                    confEl.className = `confidence ${getConfidenceClass(e.confidence)}`;
                    
                    document.getElementById('eurusd-action').textContent = e.action || '--';
                    document.getElementById('eurusd-direction').textContent = e.direction || '--';
                    document.getElementById('eurusd-grade').textContent = e.grade || '--';
                    document.getElementById('eurusd-adx').textContent = e.adx ? e.adx.toFixed(1) : '--';
                    document.getElementById('eurusd-rsi').textContent = e.rsi ? e.rsi.toFixed(1) : '--';
                    document.getElementById('eurusd-regime').textContent = e.regime || '--';
                }
                
                document.getElementById('error').style.display = 'none';
                document.getElementById('timestamp').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error: ${error.message}. Make sure bot is running on port 5001.`;
            }
        }

        // Auto-refresh every 2 seconds
        setInterval(fetchData, 2000);
        
        // Initial fetch
        fetchData();
    </script>
</body>
</html>
